<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Portfolio | แฟ้มสะสมผลงาน</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">


  <style>

    /* ================================
       RESET
    ================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    :root {

      --pink-main: #d81b60;
      --pink-dark: #8e1745;
      --pink-light: #ffdce9;
      --pink-soft: #fff4f8;

      --text-dark: #4b1c30;
      --text: #755565;

      --white: #ffffff;

    }


    html {
      scroll-behavior: smooth;
    }


    body {

      font-family: "Prompt", sans-serif;

      color: var(--text);

      background:

        radial-gradient(
          circle at 10% 10%,
          rgba(216,27,96,.18),
          transparent 30%
        ),

        radial-gradient(
          circle at 90% 30%,
          rgba(255,150,190,.25),
          transparent 30%
        ),

        linear-gradient(
          135deg,
          #fffafd,
          #ffeaf2,
          #fff5f8
        );

      overflow-x: hidden;

    }


    /* ================================
       BACKGROUND
    ================================= */

    .background {

      position: fixed;

      inset: 0;

      pointer-events: none;

      z-index: -1;

      overflow: hidden;

    }


    .orb {

      position: absolute;

      border-radius: 50%;

      filter: blur(4px);

      animation: floating 8s ease-in-out infinite;

    }


    .orb1 {

      width: 350px;
      height: 350px;

      background: #ffb3ca;

      top: -150px;
      left: -100px;

      opacity: .35;

    }


    .orb2 {

      width: 300px;
      height: 300px;

      background: #e91e63;

      right: -120px;
      top: 35%;

      opacity: .10;

      animation-delay: 2s;

    }


    .orb3 {

      width: 400px;
      height: 400px;

      background: #ffc9dc;

      left: 30%;
      bottom: -250px;

      opacity: .3;

      animation-delay: 4s;

    }


    @keyframes floating {

      0%,100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-30px);
      }

    }


    /* ================================
       NAVBAR
    ================================= */

    nav {

      position: sticky;

      top: 0;

      z-index: 100;

      display: flex;

      justify-content: space-between;

      align-items: center;

      padding: 18px 7%;

      background: rgba(255,255,255,.72);

      backdrop-filter: blur(18px);

      border-bottom: 1px solid rgba(216,27,96,.1);

    }


    .logo {

      display: flex;

      align-items: center;

      gap: 12px;

      font-family: Kanit;

      font-size: 20px;

      font-weight: 600;

      color: var(--pink-dark);

    }


    .logo-icon {

      width: 45px;
      height: 45px;

      border-radius: 14px;

      display: flex;

      align-items: center;

      justify-content: center;

      color: white;

      font-size: 21px;

      background:
        linear-gradient(
          135deg,
          #b31255,
          #ec407a
        );

      box-shadow:
        0 10px 30px rgba(216,27,96,.25);

    }


    .back {

      text-decoration: none;

      color: var(--pink-dark);

      padding: 10px 18px;

      border-radius: 50px;

      border: 1px solid rgba(216,27,96,.15);

      background: rgba(255,255,255,.6);

      transition: .3s;

    }


    .back:hover {

      background: white;

      transform: translateY(-2px);

    }


    /* ================================
       HERO
    ================================= */

    .hero {

      min-height: 70vh;

      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;

      padding: 90px 7%;

    }


    .hero-content {

      max-width: 950px;

      animation: fadeUp 1s ease;

    }


    @keyframes fadeUp {

      from {

        opacity: 0;

        transform: translateY(40px);

      }

      to {

        opacity: 1;

        transform: translateY(0);

      }

    }


    .badge {

      display: inline-block;

      padding: 10px 22px;

      border-radius: 50px;

      color: var(--pink-main);

      background: rgba(255,255,255,.7);

      border: 1px solid rgba(216,27,96,.15);

      margin-bottom: 25px;
