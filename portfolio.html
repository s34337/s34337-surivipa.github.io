<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Portfolio | Chulalongkorn Style</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Playfair+Display:wght@500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background: #fff8fb;
            color: #4a2635;
            line-height: 1.8;
        }

        /* =========================
           NAVBAR
        ========================= */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;

            background: rgba(255, 248, 251, 0.92);
            backdrop-filter: blur(15px);

            border-bottom: 1px solid rgba(150, 20, 70, 0.15);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 18px 20px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        nav a {
            text-decoration: none;
            color: #8f174f;
            padding: 10px 24px;
            border-radius: 30px;
            transition: 0.3s;
            font-weight: 500;
        }

        nav a:hover {
            background: #8f174f;
            color: white;
            box-shadow: 0 8px 25px rgba(143, 23, 79, 0.25);
        }

           HERO
